<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spools Uploader settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #15110e;
        color: #f2ece4;
        max-width: 420px;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        font-size: 13px;
        color: #b3a89c;
        line-height: 1.5;
      }
      a {
        color: #e8a86c;
      }
      label {
        display: block;
        font-size: 12px;
        color: #b3a89c;
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 13px;
        padding: 9px 10px;
        border: 1px solid #3a322a;
        border-radius: 6px;
        background: #1f1a15;
        color: #f2ece4;
      }
      button {
        margin-top: 14px;
        font: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: #e8a86c;
        color: #2a1c14;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        font-size: 12px;
        margin-top: 10px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Spools Uploader</h1>
    <p>
      Paste a personal API token to let the extension upload on your behalf. Tokens are an
      Amber+ perk — create one from
      <a href="https://spools.studio/dashboard/api" target="_blank" rel="noopener">your dashboard</a>.
    </p>
    <label for="token">API token</label>
    <input id="token" type="password" placeholder="spt_..." autocomplete="off" />
    <button id="save">Save</button>
    <p class="status" id="status"></p>
    <script src="browser-polyfill.js"></script>
    <script src="options.js"></script>
  </body>
</html>
